{{/*
Optional Redis peer for GKE same-node A/B vs cache-custom (M10).
Purpose: co-locate Redis on the same node via required podAffinity to chart selectorLabels
(so affinity stays correct if nameOverride / chart name labels change).
Enabled only when benchmark.enabled=true (see bench/run-gke.sh).
*/}}
{{- if .Values.benchmark.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cache-custom.fullname" . }}-redis-bench
  labels:
    {{- include "cache-custom.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis-bench
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cache-custom.name" . }}-redis-bench
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "cache-custom.name" . }}-redis-bench
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: redis-bench
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "cache-custom.selectorLabels" . | nindent 18 }}
              topologyKey: kubernetes.io/hostname
              namespaces:
                - {{ .Release.Namespace | quote }}
      containers:
        - name: redis
          image: {{ .Values.benchmark.redis.image | quote }}
          # maxmemory / policy overridden per matrix cell via CONFIG SET in the Job.
          args:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory
            - {{ .Values.benchmark.matrix.maxMemory | quote }}
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - name: redis
              containerPort: {{ .Values.benchmark.redis.port }}
          resources:
            {{- toYaml .Values.benchmark.redis.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cache-custom.fullname" . }}-redis-bench
  labels:
    {{- include "cache-custom.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis-bench
spec:
  selector:
    app.kubernetes.io/name: {{ include "cache-custom.name" . }}-redis-bench
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: redis
      port: {{ .Values.benchmark.redis.port }}
      targetPort: redis
{{- end }}
