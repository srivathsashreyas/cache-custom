{{/*
Secret holding the server JSON config (includes tenant passwords).
Purpose: mount as /config/config.json so the process never bakes secrets into the image.
Rotate by helm upgrade with a new serverConfig value.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cache-custom.fullname" . }}-config
  labels:
    {{- include "cache-custom.labels" . | nindent 4 }}
type: Opaque
stringData:
  # File name must match the container args (-config /config/config.json).
  config.json: |
    {{- .Values.serverConfig | nindent 4 }}
