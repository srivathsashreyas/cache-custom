# Lightweight redis-benchmark smoke against local go_cache (M10).
# Not on every PR — manual or optional; full matrix is local/GKE via bench/scripts.
name: Bench smoke

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "bench/**"
      - "internal/**"
      - "cmd/**"
      - ".github/workflows/bench-smoke.yml"

jobs:
  local-smoke:
    runs-on: ubuntu-latest
    # Only auto-run on master path pushes if explicitly enabled (default off to keep CI quiet).
    if: >
      github.event_name == 'workflow_dispatch' ||
      vars.RUN_BENCH_SMOKE == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install redis tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq redis-tools redis-server
      - name: Bench smoke
        run: |
          chmod +x bench/*.sh
          ./bench/ci-smoke.sh
