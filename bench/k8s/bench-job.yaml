# One-shot Job: redis-benchmark against go_cache Service and redis-bench Service.
# Purpose: in-cluster client for GKE same-node matrix (results in job logs).
#
# Env injected by run-gke.sh:
#   GO_CACHE_HOST, GO_CACHE_PORT, REDIS_HOST, REDIS_PORT
#   BENCH_REQUESTS, BENCH_CLIENTS, AUTH user/pass for go_cache
apiVersion: batch/v1
kind: Job
metadata:
  name: redis-benchmark-job
  namespace: cache-bench
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: redis-benchmark-job
    spec:
      restartPolicy: Never
      # Prefer same node as cache-custom for client placement (optional fairness).
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: cache-custom
                topologyKey: kubernetes.io/hostname
                namespaces:
                  - cache-custom
      containers:
        - name: bench
          image: redis:7-alpine
          env:
            - name: GO_CACHE_HOST
              value: "cache-custom.cache-custom.svc.cluster.local"
            - name: GO_CACHE_PORT
              value: "9001"
            - name: REDIS_HOST
              value: "redis-bench.cache-bench.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: BENCH_REQUESTS
              value: "50000"
            - name: BENCH_CLIENTS
              value: "50"
            - name: GO_USER
              value: "App1"
            - name: GO_PASS
              value: "secret1"
          command: ["sh", "-c"]
          args:
            - |
              set -e
              echo "=== GKE same-node redis-benchmark ==="
              echo "go_cache=${GO_CACHE_HOST}:${GO_CACHE_PORT}"
              echo "redis=${REDIS_HOST}:${REDIS_PORT}"
              echo "requests=${BENCH_REQUESTS} clients=${BENCH_CLIENTS}"
              echo
              echo "===== Redis (no auth) SET/GET ====="
              redis-benchmark -h "$REDIS_HOST" -p "$REDIS_PORT" -n "$BENCH_REQUESTS" -c "$BENCH_CLIENTS" -P 1 -r 10000 -t set,get -q
              echo
              echo "===== Redis pipeline P=16 ====="
              redis-benchmark -h "$REDIS_HOST" -p "$REDIS_PORT" -n "$BENCH_REQUESTS" -c "$BENCH_CLIENTS" -P 16 -r 10000 -t set,get -q
              echo
              echo "===== go_cache AUTH App1 SET/GET ====="
              redis-benchmark -h "$GO_CACHE_HOST" -p "$GO_CACHE_PORT" --user "$GO_USER" -a "$GO_PASS" -n "$BENCH_REQUESTS" -c "$BENCH_CLIENTS" -P 1 -r 10000 -t set,get -q
              echo
              echo "===== go_cache pipeline P=16 ====="
              redis-benchmark -h "$GO_CACHE_HOST" -p "$GO_CACHE_PORT" --user "$GO_USER" -a "$GO_PASS" -n "$BENCH_REQUESTS" -c "$BENCH_CLIENTS" -P 16 -r 10000 -t set,get -q
              echo
              echo "GKE_BENCH_OK"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
